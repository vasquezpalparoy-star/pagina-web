name: Compilar y publicar las tres aplicaciones PDF en español
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-pdf-es.yml'
permissions:
  contents: write
concurrency:
  group: grafiplot-pdf-publicacion
  cancel-in-progress: false
jobs:
  compilar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar proyecto GRAFIPLOT
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar carpeta
        run: mkdir -p aplicaciones-pdf
      - name: Preparar compresor ORIGINAL
        run: |
          git clone --depth 1 https://github.com/JGM-89/pdf-compressor-web.git /tmp/compresor
          cd /tmp/compresor
          npm ci
          npm run vendor
          cd "$GITHUB_WORKSPACE"
          mkdir -p aplicaciones-pdf/compresor
          rsync -a --exclude='.git' --exclude='node_modules' /tmp/compresor/ aplicaciones-pdf/compresor/
          test -f aplicaciones-pdf/compresor/index.html
          test -d aplicaciones-pdf/compresor/vendor
          python3 traducciones-pdf/inyectar-es.py aplicaciones-pdf/compresor traducciones-pdf/es-visible.js
      - name: Preparar editor ORIGINAL
        run: |
          git clone --depth 1 https://github.com/vensas/pdf-editor.git /tmp/editor
          corepack enable
          cd /tmp/editor
          corepack pnpm install --frozen-lockfile
          corepack pnpm test
          PUBLIC_BASE_PATH='./' corepack pnpm build
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/editor/dist aplicaciones-pdf/editor
          cp /tmp/editor/LICENSE aplicaciones-pdf/editor/LICENSE
          python3 traducciones-pdf/inyectar-es.py aplicaciones-pdf/editor traducciones-pdf/es-visible.js
      - name: Preparar Paperless PDF ORIGINAL
        run: |
          git clone --depth 1 https://github.com/IACBI/paperless-pdf.git /tmp/paperless
          cd /tmp/paperless
          npm ci
          npm test
          npm run build
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/paperless/dist aplicaciones-pdf/paperless
          cp /tmp/paperless/LICENSE aplicaciones-pdf/paperless/LICENSE
          test -f aplicaciones-pdf/paperless/tesseract/worker.min.js
          test -d aplicaciones-pdf/paperless/tessdata
          python3 traducciones-pdf/inyectar-es.py aplicaciones-pdf/paperless traducciones-pdf/es-visible.js
      - name: Comprobar que las copias tienen todos los archivos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dirs = ['compresor','editor','paperless']
          total=0
          for name in dirs:
              base=Path('aplicaciones-pdf')/name
              assert (base/'index.html').is_file(), f'Falta HTML: {name}'
              assert (base/'LICENSE').is_file(), f'Falta licencia: {name}'
              assert (base/'grafiplot-es/traduccion-interfaz.js').is_file(), f'Falta traducción: {name}'
              size=sum(x.stat().st_size for x in base.rglob('*') if x.is_file())
              print(f'{name}: {size/(1024*1024):.1f} MB')
              total+=size
          assert total<850*1024*1024, 'Excede límite de publicación estática'
          PY
      - name: Activar las copias traducidas en tres pestañas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('pdf-aplicaciones.html')
          html=path.read_text(encoding='utf-8')
          links={
            'https://pdf-compressor.org/':'./aplicaciones-pdf/compresor/',
            'https://pdf-editor.apps.vensas.de/':'./aplicaciones-pdf/editor/',
            'https://iacbi.github.io/paperless-pdf/':'./aplicaciones-pdf/paperless/'
          }
          for original, local in links.items():
            assert original in html, f'No se encuentra enlace original: {original}'
            html=html.replace(original,local)
          html=html.replace('Las aplicaciones originales pueden mostrar sus menús en inglés.', 'Estas copias incluyen una capa de traducción de interfaz al español.')
          html=html.replace('Abre la aplicación original en Chrome → clic derecho → «Traducir al español». No hace falta modificar su código.', 'Las herramientas se ejecutan en español en una copia local, sin cambiar los motores originales.')
          html=html.replace('Abrir y traducir al español ↗','Abrir aplicación en español ↗')
          html=html.replace('Si no aparece dentro de esta página, pulsa el botón para abrir la aplicación original.', 'Si no aparece dentro de esta página, pulsa el botón para abrir la aplicación en una pestaña nueva.')
          html=html.replace('Las aplicaciones originales pueden impedir su visualización aquí. Para traducir sus menús, pulsa «Abrir y traducir al español», luego en Google Chrome haz clic derecho sobre la página y selecciona «Traducir al español». La traducción automática no garantiza que todos los textos queden traducidos. Los archivos PDF no se traducen ni se modifican con este paso.', 'Las aplicaciones se alojan en este mismo sitio. Sus funciones originales se conservan, pero algunos textos pueden permanecer en inglés mientras se completan las traducciones.')
          path.write_text(html,encoding='utf-8')
          PY
          touch .nojekyll
      - name: Guardar publicación en la rama principal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aplicaciones-pdf/ pdf-aplicaciones.html .nojekyll
          if git diff --cached --quiet; then
            echo 'Sin cambios por publicar.'
          else
            git commit -m "Publicar tres aplicaciones PDF completas con interfaz traducida al español"
            git push origin HEAD:main
          fi
