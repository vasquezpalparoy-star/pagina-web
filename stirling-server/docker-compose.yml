services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SYSTEM_DEFAULTLOCALE: es-ES
      UI_APPNAME: "GRAFIPLOT PDF"
      UI_APPNAMENAVBAR: "GRAFIPLOT PDF"
      UI_HOMEDESCRIPTION: "Herramientas PDF en español · GRAFIPLOT VASQUEZ"
      SECURITY_ENABLELOGIN: "true"
      SYSTEM_GOOGLEVISIBILITY: "false"
      SYSTEM_FILEUPLOADLIMIT: "100MB"
    volumes:
      - ./data/configs:/configs
      - ./data/logs:/logs
      - ./data/customFiles:/customFiles
      - ./data/pipeline:/pipeline
      - ./data/storage:/storage
      - ./data/tessdata:/usr/share/tessdata
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/info/status | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PDF_DOMAIN: ${PDF_DOMAIN:-pdf.grafiplotvasquez.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      stirling-pdf:
        condition: service_started
volumes:
  caddy_data:
  caddy_config:
