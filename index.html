<!DOCTYPE html>
<html lang="es" class="h-full scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Centro de Copias, Imprenta Digital, Gigantografías y Diseño Gráfico. Soluciones integrales para empresas y estudiantes.">
    <meta name="keywords" content="centro de copias, imprenta, impresión digital, copias, impresión de tesis, gigantografías, banners, anillados, impresión a color">
    <title>Grafiplot - Centro de Copias e Imprenta Digital</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], },
                    colors: {
                        brand: { 
                            50: '#fef2f2', 100: '#fde6e6', 200: '#fbcaca', 300: '#f8a3a3', 
                            400: '#f26e6e', 500: '#e31837', /* Rojo Vibrante del Logo */
                            600: '#d0132d', 700: '#af0e24', 800: '#911122', 900: '#791421', 950: '#42060e' 
                        },
                        grafi: { 900: '#1a1a1a' } /* Negro Profundo del Logo */
                    },
                    boxShadow: { 
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.05)',
                        'premium': '0 20px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-left { animation: slideLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .zoom-in { animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideLeft { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .text-shadow-sm { text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        /* Estilos del Logo Recreados de la imagen */
        .logo-g { font-size: 2.3rem; letter-spacing: -0.06em; }
        .logo-rafiplot { font-size: 2.3rem; letter-spacing: -0.04em; margin-left: -0.02em; }
        .logo-vasquez { font-size: 0.95rem; letter-spacing: -0.01em; right: 2px; bottom: -0.5rem; }
        
        @media (min-width: 640px) {
            .logo-g { font-size: 3rem; }
            .logo-rafiplot { font-size: 3rem; }
            .logo-vasquez { font-size: 1.25rem; bottom: -0.65rem; }
        }
        
        /* Ocultar scrollbar pero permitir scroll para categorías horizontales */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .theme-switch { position:fixed;right:1rem;bottom:1rem;z-index:9998;padding:.75rem 1rem;border-radius:999px;color:white;font-weight:800;background:linear-gradient(135deg,#b21d43,#50215c);box-shadow:0 12px 30px #35142766; }
        #cotizador {background:radial-gradient(circle at 12% 12%,#ffdbe5,transparent 38%),linear-gradient(125deg,#fff7fa,#edf0ff 62%,#f6eaff)}
        #cotizador > div > .flex > div:first-child {background:linear-gradient(145deg,#fff,#fff8fb);box-shadow:0 25px 60px #3e16331c}
        #cotizador > div > .flex > div:last-child > div {background:linear-gradient(145deg,#171b31,#48203f 70%,#801e40)}
        [data-theme="dark"] {color-scheme:dark}
        [data-theme="dark"] body {background:linear-gradient(145deg,#10111f,#21172a);color:#e7eaf2}
        [data-theme="dark"] .bg-white,[data-theme="dark"] .bg-slate-50,[data-theme="dark"] .glass-nav {background:#1d2031!important}
        [data-theme="dark"] #cotizador {background:radial-gradient(circle at 10% 15%,#592039,transparent 42%),linear-gradient(130deg,#121827,#242139 70%,#341c33)!important}
        [data-theme="dark"] #cotizador > div > .flex > div:first-child {background:linear-gradient(145deg,#24283a,#302237)!important}
        [data-theme="dark"] .logo-g,[data-theme="dark"] .logo-vasquez {color:#f3f4fa!important}
        [data-theme="dark"] .text-slate-900,[data-theme="dark"] .text-slate-800,[data-theme="dark"] .text-slate-700 {color:#f3f4fa!important}
        [data-theme="dark"] .text-slate-500,[data-theme="dark"] .text-slate-600 {color:#bbc3d4!important}
        [data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea {background:#272b3c!important;color:#f6f6fa!important;border-color:#50546b!important}
        .auto-field {display:block;width:100%;padding:.75rem;border:1px solid #cbd5e1;border-radius:.8rem;background:#fff;font-size:.875rem;margin-top:.4rem;min-width:0}
        .auto-label {font-size:.75rem;font-weight:700;color:inherit}
        .auto-summary {background:linear-gradient(145deg,#191c34,#542240);color:#fff;border-radius:1.5rem;padding:1.75rem}
        .auto-summary p {color:#e2dbe7}
        .auto-summary .auto-line {display:flex;justify-content:space-between;gap:1rem;padding:.75rem 0;border-bottom:1px solid #ffffff22;font-size:.85rem}
        [data-theme="dark"] .border-slate-200,[data-theme="dark"] .border-slate-100 {border-color:#46495c!important}
        .print-service-dialog {border:0;padding:0;background:transparent;width:min(920px,calc(100vw - 24px));max-height:90dvh;border-radius:24px;box-shadow:0 30px 100px #0008;overflow:auto;color:inherit}
        .print-service-dialog::backdrop {background:#111827b8;backdrop-filter:blur(6px)}
        .print-service-content {max-height:72dvh;overflow-y:auto}
    </style>
</head>
<body class="h-full bg-[#f8fafc] text-slate-900 overflow-x-hidden selection:bg-brand-200">

    <button type="button" data-theme-toggle onclick="window.toggleTheme()" class="theme-switch">🌙 Modo oscuro</button>
    <!-- Contenedor global de alertas -->
    <div id="toast-container" class="fixed top-4 right-4 sm:top-6 sm:right-6 z-[9999] flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

    <!-- Raíz de la Aplicación -->
    <div id="root" class="min-h-screen flex flex-col transition-opacity duration-300">
        <div class="flex-1 flex flex-col items-center justify-center bg-white">
            <div class="w-16 h-16 border-4 border-slate-100 border-t-brand-600 rounded-full animate-spin"></div>
            <p class="text-slate-500 font-medium mt-6 animate-pulse text-sm tracking-wide uppercase">Conectando a Grafiplot Platform...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURACIÓN DE TU FIREBASE REAL EXTRAÍDO DE TU ARCHIVO CONFIGURADO
        const USER_FIREBASE_CONFIG = {
            apiKey: "AIzaSyClluUAu9eVV2cdh0GGA2-VdyHDaZilZHo",
            authDomain: "pagina-web-grafiplot-oficial.firebaseapp.com",
            databaseURL: "https://pagina-web-grafiplot-oficial-default-rtdb.firebaseio.com",
            projectId: "pagina-web-grafiplot-oficial",
            storageBucket: "pagina-web-grafiplot-oficial.firebasestorage.app",
            messagingSenderId: "116976625167",
            appId: "1:116976625167:web:27c27cc4abe77ccacfa57a",
            measurementId: "G-ESY8JXWSVG"
        };

        const INVENTORY_FIREBASE_CONFIG = {
            apiKey: "AIzaSyBYrKgwH889S6A9Ahoc7E9ZAkpvavFkEsc",
            authDomain: "imventario-105b7.firebaseapp.com",
            projectId: "imventario-105b7",
            storageBucket: "imventario-105b7.firebasestorage.app",
            messagingSenderId: "25017694564",
            appId: "1:25017694564:web:45b14399aed811d9202271"
        };

        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'grafiplot-tienda-v4';

        const DEFAULT_SETTINGS = {
            storeName: 'Grafiplot Vasquez',
            ruc: '20601831881',
            companyName: 'Grafiplot Vasquez S.A.C.',
            announcement: '💥 ¡NUEVOS SERVICIOS DE IMPRENTA DIGITAL Y GIGANTOGRAFÍAS! 💥',
            heroBanner: 'https://images.unsplash.com/photo-1598520106830-8c45c2035460?auto=format&fit=crop&q=80&w=1600',
            heroTitle: 'Centro de Copias e Impresión Profesional',
            heroSubtitle: 'Soluciones integrales de diseño gráfico, papelería empresarial, gigantografías y venta de equipos plotter de alta resolución.',
            contactAddress: 'Av. Garcilaso de la Vega 1236, Lima, Perú',
            contactPhone: '51952628844',
            contactEmail: 'ventas@grafiplot.com',
            mapLink: 'https://maps.app.goo.gl/Limacentro',
            footerAbout: 'Líderes en brindar soluciones integrales para la industria publicitaria, estudiantes y empresas. Calidad y rapidez garantizada.',
            footerSchedule: 'Lunes a Sábado: 9:00 AM - 7:00 PM',
            socialFacebook: 'https://facebook.com',
            socialInstagram: 'https://instagram.com',
            socialTiktok: 'https://tiktok.com',
            socialYoutube: 'https://youtube.com',
            footerLinksTitle: 'Atención al Cliente',
            footerLink1Text: 'Consultar Soporte Técnico',
            footerLink1Url: '#',
            footerLink2Text: 'Cotizaciones para Empresas',
            footerLink2Url: '#',
            adminPassword: 'admin',
            // Nuevos campos SEO
            seoTitle: 'Grafiplot - Imprenta, Gigantografías y Equipos',
            seoDescription: 'Tu centro integral de impresión digital, copias, planos y diseño gráfico. Atención rápida y profesional a nivel nacional.',
            printServiceDetails: {},
            autoPrices: {}
        };

        const state = {
            view: 'store', 
            adminTab: 'dashboard', 
            isAdminAuthenticated: false,
            showAdminLogin: false,
            isLoaded: false,
            connectionStatus: 'connecting',
            connectionError: '',
            inventoryStatus: 'connecting',
            inventoryError: '',
            
            // Colecciones de Firebase
            products: [],
            services: [],
            quotes: [],
            orders: [],
            testimonials: [],
            faqs: [],
            
            settings: { ...DEFAULT_SETTINGS },
            
            // UI States
            searchTerm: '',
            selectedCategory: 'Todas',
            filters: { onlyOffers: false, onlyNew: false, brand: '' },
            sortBy: 'recent',
            selectedProduct: null,
            activeDetailImage: '',
            isMobileMenuOpen: false,
            
            // Admin Modals
            adminModalOpen: false,
            editingProduct: null,
            deleteConfirmOpen: false,
            productToDelete: null,
            
            // Carrito
            cart: [],
            isCartOpen: false,
            
            // Nuevos Formularios y Estados
            autoQuote: { client: '', phone: '', pages: 1, copies: 1, format: 'A4_1c', tariff: 'menor', color: 'color', binding: false, spiral: 'Negro', extra: 'none', design: false, urgent: false }
        };

        let db, auth;

        window.showToast = (title, message, type = 'info') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'i';
            const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-grafi-900';
            
            toast.className = `slide-up flex items-start gap-4 p-4 bg-white border border-slate-100 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.08)] pointer-events-auto overflow-hidden relative`;
            toast.innerHTML = `
                <div class="w-10 h-10 rounded-xl ${bgColor} text-white flex items-center justify-center shrink-0 font-black shadow-inner">${icon}</div>
                <div class="flex-1 pt-1">
                    <h4 class="font-black text-slate-900 text-sm leading-none mb-1">${title}</h4>
                    <p class="text-xs text-slate-500 font-medium">${message}</p>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-full', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        window.formatPrice = (price) => parseFloat(price).toFixed(2);

        let inventoryUnsubscribe = null;
        const inventoryText = value => typeof value === 'string' ? value : '';
        const inventoryNumber = value => Number.isFinite(Number(value)) ? Math.max(0,Number(value)) : 0;
        function inventoryImage(value) {
            try { const url = new URL(value); return ['https:','http:'].includes(url.protocol) ? url.href : ''; } catch { return ''; }
        }
        function normalizeInventoryProduct(snapshot) {
            const data = snapshot.data();
            const images=(Array.isArray(data.images)?data.images:[]).map(img=>inventoryImage(typeof img==='string'?img:img?.url)).filter(Boolean);
            if(!images.length && data.imageUrl) { const image=inventoryImage(data.imageUrl); if(image) images.push(image); }
            const isService=data.category==='Servicio';
            // Only public catalog fields enter the website view model.
            return {id:snapshot.id,name:inventoryText(data.name)||'Producto sin nombre',description:inventoryText(data.description),category:inventoryText(data.category)||'Otros',
                price:inventoryNumber(data.price),bulkPrice:inventoryNumber(data.bulkPrice),stock:Math.floor(inventoryNumber(data.stock)),measureUnit:inventoryText(data.measureUnit)||'unidades',sku:inventoryText(data.barcode),
                image:images[0]||'',additionalImages:images.slice(1),isPriority:data.isPriority===true,isService,allowCart:!isService,isActive:true,isOffer:false,isNew:false,
                createdAt:Date.parse(data.updatedAt)||0};
        }
        function canOrderProduct(p) { return state.inventoryStatus==='connected' && !p.isService && p.stock>0; }
        function stockLabel(p) {
            if(p.isService) return 'Servicio · consultar disponibilidad';
            if(state.inventoryStatus!=='connected') return 'Stock por confirmar';
            return p.stock>0 ? `En stock: ${p.stock} ${esc(p.measureUnit)}` : 'Sin stock';
        }
        function inventoryStatusText() {
            return ({connecting:'Actualizando productos y existencias…',connected:'Productos y stock actualizados desde el inventario.',cached:'Sin conexión confirmada. Existencias por verificar.',error:'No se pudo actualizar el inventario. Consulta disponibilidad por WhatsApp.'})[state.inventoryStatus];
        }
        function reconcileInventoryViews() {
            const byId=new Map(state.products.map(p=>[p.id,p]));
            if(state.selectedProduct) {
                state.selectedProduct=byId.get(state.selectedProduct.id)||null;
                if(state.selectedProduct && ![state.selectedProduct.image,...state.selectedProduct.additionalImages].includes(state.activeDetailImage)) state.activeDetailImage=state.selectedProduct.image;
            }
            state.cart=state.cart.flatMap(item=>{
                const product=byId.get(item.product.id);
                return product && !product.isService && product.stock>0 ? [{product,quantity:Math.min(item.quantity,product.stock)}] : [];
            });
            if(state.selectedCategory!=='Todas' && !state.products.some(p=>p.category===state.selectedCategory)) state.selectedCategory='Todas';
        }
        function applyInventorySnapshot(snapshot) {
            state.products=snapshot.docs.map(normalizeInventoryProduct);
            state.inventoryStatus=snapshot.metadata?.fromCache?'cached':'connected';
            state.inventoryError='';
            reconcileInventoryViews();
            if(!(state.view==='admin' && state.adminTab==='settings')) render();
        }
        async function initInventoryReader() {
            try {
                const inventoryApp=initializeApp(INVENTORY_FIREBASE_CONFIG,'grafiplot-inventory-reader');
                const inventoryAuth=getAuth(inventoryApp);
                const inventoryDb=getFirestore(inventoryApp);
                await signInAnonymously(inventoryAuth);
                if(inventoryUnsubscribe) inventoryUnsubscribe();
                inventoryUnsubscribe=onSnapshot(collection(inventoryDb,'inventory'),{includeMetadataChanges:true},applyInventorySnapshot,error=>{
                    console.error('Inventory read:',error);
                    state.inventoryStatus='error';state.inventoryError=error.code||'unavailable';
                    if(!(state.view==='admin' && state.adminTab==='settings')) render();
                });
            } catch(error) {
                console.error('Inventory connection:',error);
                state.inventoryStatus='error';state.inventoryError=error.code||'unavailable';render();
            }
        }

        async function initCloudStore() {
            try {
                const app = initializeApp(USER_FIREBASE_CONFIG);
                auth = getAuth(app);
                db = getFirestore(app);
                
                await signInAnonymously(auth);

                if (!auth.currentUser) throw new Error("No se pudo iniciar sesión anónima.");
                state.connectionStatus = 'connected';
                setupRealtimeListeners();
            } catch (error) {
                console.error("Error iniciando base de datos:", error);
                state.connectionStatus = 'error';
                let errorMsg = error.message || "Fallo en la red de la nube.";
                if (error.code === 'auth/operation-not-allowed') {
                    errorMsg = "ATENCIÓN: Activa la Autenticación 'Anónima' en tu consola Firebase.";
                }
                state.connectionError = errorMsg;
                window.showToast("Modo Local", "Base de datos desconectada. Mostrando interfaz básica.", "error");
                state.isLoaded = true; 
                render();
            }
        }

        function updateSEO() {
            document.title = state.settings.seoTitle || state.settings.storeName;
            const desc = document.querySelector('meta[name="description"]');
            if (desc) desc.setAttribute('content', state.settings.seoDescription || state.settings.heroSubtitle);
        }

        function setupRealtimeListeners() {
            const settingsDocRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'settings', 'config');
            
            // Nuevas colecciones
            const servicesRef = collection(db, 'artifacts', currentAppId, 'public', 'data', 'services');
            const quotesRef = collection(db, 'artifacts', currentAppId, 'public', 'data', 'quotes');
            const faqsRef = collection(db, 'artifacts', currentAppId, 'public', 'data', 'faqs');
            const testimonialsRef = collection(db, 'artifacts', currentAppId, 'public', 'data', 'testimonials');

            onSnapshot(settingsDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    state.settings = { ...DEFAULT_SETTINGS, ...docSnap.data() };
                    updateSEO();
                } else if (auth.currentUser) {
                    setDoc(settingsDocRef, DEFAULT_SETTINGS);
                }
                render();
            });

            // Listeners seguros (no rompen si la colección está vacía)
            onSnapshot(servicesRef, (snap) => { state.services = snap.docs.map(d => ({ id: d.id, ...d.data() })); if(!(state.view==='admin' && state.adminTab==='settings')) render(); }, e => console.warn(e));
            onSnapshot(quotesRef, (snap) => { state.quotes = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, e => console.warn(e));
            onSnapshot(faqsRef, (snap) => { state.faqs = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, e => console.warn(e));
            onSnapshot(testimonialsRef, (snap) => { state.testimonials = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, e => console.warn(e));
        }

        window.setView = (v) => { state.view = v; state.isMobileMenuOpen = false; window.scrollTo(0,0); render(); };
        window.setAdminTab = (t) => { state.adminTab = t; render(); };
        window.toggleMobileMenu = () => { state.isMobileMenuOpen = !state.isMobileMenuOpen; render(); };
        
        window.executeSearch = (val) => { 
            state.searchTerm = val.trim(); 
            if(state.searchTerm.length > 0) state.selectedCategory = 'Todas';
            render(); 
            const catEl = document.getElementById('catalog');
            if(catEl && state.view === 'store') catEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        
        window.setCategory = (category) => { 
            state.selectedCategory = category; state.searchTerm = ''; state.isMobileMenuOpen = false;
            render(); 
        };
        
        window.setSortBy = (val) => { state.sortBy = val; render(); };
        window.toggleFilter = (filterKey, checked) => { state.filters[filterKey] = checked; render(); };

        window.openProductDetails = (id) => {
            const p = state.products.find(x => x.id === id);
            if (p) { state.selectedProduct = p; state.activeDetailImage = p.image; render(); }
        };
        window.closeProductDetails = () => { state.selectedProduct = null; render(); };
        window.setActiveDetailImage = (img) => { state.activeDetailImage = img; renderModals(); };

        // Admin Auth
        window.openAdminLogin = () => {
            if (state.isAdminAuthenticated) window.setView('admin');
            else { state.showAdminLogin = true; render(); }
        };
        window.closeAdminLogin = () => { state.showAdminLogin = false; render(); };
        window.handleAdminLogin = (e) => {
            e.preventDefault();
            const pass = document.getElementById('login-password').value;
            if (pass === state.settings.adminPassword) {
                state.isAdminAuthenticated = true; state.showAdminLogin = false; 
                window.setView('admin'); window.showToast("Acceso Permitido", "Has iniciado sesión como administrador.", "success");
            } else {
                const err = document.getElementById('login-error');
                err.classList.remove('hidden');
                setTimeout(() => err.classList.add('hidden'), 3000);
            }
        };
        window.handleLogout = () => { state.isAdminAuthenticated = false; window.setView('store'); window.showToast("Sesión Finalizada", "", "info"); };

        window.handleSaveSettings = async (e) => {
            e.preventDefault();
            if (!auth || !auth.currentUser) { window.showToast('Sin conexión', 'Conecta con Firebase para guardar tus ajustes.', 'error'); return; }
            const data = new FormData(e.target);
            const newSettings = { ...state.settings };
            try {
            Object.keys(DEFAULT_SETTINGS).forEach(field => {
                const val = data.get(field);
                if (val !== null) { if (field.startsWith('price')) { const amount = Number(val); if (!Number.isFinite(amount) || amount < 0) { window.showToast('Precio inválido', field, 'error'); throw new Error('Precio inválido'); } newSettings[field] = amount; } else newSettings[field] = val; }
            });
                if (!state.isAdminAuthenticated) return;
                newSettings.autoPrices = {};
                for (const key of autoPriceKeys()) {
                    const raw = data.get('auto_' + key);
                    if (raw === null || raw.trim() === '') continue;
                    const value = Number(raw);
                    if (!Number.isFinite(value) || value < 0) throw new Error('Precio inválido');
                    newSettings.autoPrices[key] = value;
                }
                newSettings.printServiceDetails = readPrintServiceSettings(data,state.settings.printServiceDetails);
                await setDoc(doc(db, 'artifacts', currentAppId, 'public', 'data', 'settings', 'config'), newSettings);
                state.settings = newSettings; updateSEO();
                window.showToast("Sincronizado", "Configuración actualizada para todos los usuarios.", "success");
            } catch(error) { window.showToast("No se pudo guardar", error.message || "Revisa la conexión a Firebase.", "error"); }
        };

        // Shopping Cart Logic
        window.toggleCart = () => { state.isCartOpen = !state.isCartOpen; render(); };
        window.addToCart = (productId, qty = 1) => {
            const product = state.products.find(p => p.id === productId);
            if (!product) return;
            if (!canOrderProduct(product)) {
                window.showToast("Consultar", "Este producto requiere consulta directa.", "info");
                return;
            }
            const existingItem = state.cart.find(item => item.product.id === productId);
            qty = Math.max(1, Math.floor(Number(qty) || 1));
            if ((existingItem?.quantity || 0) + qty > product.stock) { window.showToast('Stock insuficiente', 'No puedes solicitar más unidades que las disponibles.', 'info'); return; }
            if (existingItem) existingItem.quantity += qty;
            else state.cart.push({ product, quantity: qty });
            
            window.showToast("Añadido", `Se agregó ${product.name} al carrito.`, "success");
            render();
        };
        window.updateCartQty = (productId, change) => {
            const item = state.cart.find(i => i.product.id === productId);
            if (!item) return;
            if (change > 0 && (!canOrderProduct(item.product) || item.quantity + change > item.product.stock)) { window.showToast('Stock insuficiente', 'Revisa la cantidad disponible.', 'info'); return; }
            item.quantity += change;
            if (item.quantity <= 0) state.cart = state.cart.filter(i => i.product.id !== productId);
            render();
        };
        window.removeFromCart = (productId) => {
            state.cart = state.cart.filter(i => i.product.id !== productId);
            window.showToast("Eliminado", "Producto removido del carrito.", "info");
            render();
        };
        window.checkoutCart = () => {
            if (state.inventoryStatus !== 'connected') { window.showToast('Stock por confirmar', 'Espera a que se actualice el inventario.', 'info'); return; }
            reconcileInventoryViews();
            if (state.cart.length === 0) { render(); return; }
            const s = state.settings;
            let message = `*¡Hola ${s.storeName}! Deseo realizar el siguiente pedido (Catálogo):*\n\n`;
            let totalSum = 0;
            state.cart.forEach((item, index) => {
                const price = item.product.isOffer ? item.product.offerPrice : item.product.price;
                const subtotal = price * item.quantity;
                totalSum += subtotal;
                message += `${index + 1}. *${item.product.name}*\n   Cantidad: ${item.quantity} | P. Unit: S/ ${window.formatPrice(price)} | Subtotal: S/ ${window.formatPrice(subtotal)}\n\n`;
            });
            message += `-----------------------------\n*SUMA TOTAL DEL PEDIDO: S/ ${window.formatPrice(totalSum)}*\n\n_Por favor confirmen stock y datos para la facturación/despacho._`;
            window.open(`https://wa.me/${s.contactPhone}?text=${encodeURIComponent(message)}`, '_blank');
        };

        // Nuevas Funciones: Cotizador e Impresiones
        const AUTO_FORMATS = [
            ...['A1','A2','A3','A4','A5','A6','A7'].flatMap(size => [
                {id:size+'_1c', label:size+' · 1 cara', perSheet:1},
                {id:size+'_2c', label:size+' · 2 caras', perSheet:2}
            ]),
            {id:'Folleto',label:'Folleto / cuadernillo A4 doblado',perSheet:4},
            {id:'2xCara_1c',label:'A4 · 2 páginas por cara · 1 cara',perSheet:2},
            {id:'2xCara_2c',label:'A4 · 2 páginas por cara · 2 caras',perSheet:4},
            ...['A0','A1','A2','A3'].map(size => ({id:'Plano_'+size,label:'Plano '+size,perSheet:1}))
        ];
        const AUTO_EXTRAS = { laminate:'Plastificado / laminado', binding:'Empastado', cut:'Corte / guillotina', design:'Diseño gráfico', urgent:'Recargo urgente (%)' };
        const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const autoPriceKeys = () => [
            ...AUTO_FORMATS.flatMap(f=>['menor','mayor'].flatMap(t=>['color','bn'].map(c=>f.id+'_'+c+'_'+t))),
            ...[1,2,3,4].map(n=>'anillado_'+n), ...Object.keys(AUTO_EXTRAS)
        ];
        const money = n => 'S/ '+Number(n).toFixed(2);
        function calculateAutoQuote(q=state.autoQuote, prices=state.settings.autoPrices || {}) {
            const format = AUTO_FORMATS.find(f=>f.id===q.format) || AUTO_FORMATS.find(f=>f.id==='A4_1c');
            const pages = Math.max(1,Math.trunc(Number(q.pages)||1));
            const copies = Math.max(1,Math.trunc(Number(q.copies)||1));
            const sheetsPerCopy = Math.ceil(pages/format.perSheet);
            const sheets = sheetsPerCopy*copies;
            const lines=[];
            const add = (key,label,quantity) => {
                const raw=prices[key];
                const price=raw === undefined || raw === null || raw === '' ? null : Number(raw);
                const amount=price !== null && Number.isFinite(price) && price>=0 ? price*quantity : null;
                lines.push({key,label,quantity,price,amount});
            };
            add(format.id+'_'+q.color+'_'+q.tariff, 'Impresión · '+sheets+' hojas', sheets);
            let volumes=0, sheetsPerVolume=0;
            if(q.binding) {
                const volumesPerCopy=Math.ceil(sheetsPerCopy/350);
                volumes=volumesPerCopy*copies;
                sheetsPerVolume=Math.ceil(sheetsPerCopy/volumesPerCopy);
                const tier=sheetsPerVolume<=100 ? 1 : sheetsPerVolume<=200 ? 2 : sheetsPerVolume<=300 ? 3 : 4;
                add('anillado_'+tier,'Anillado · '+volumes+' tomo(s) · '+q.spiral,volumes);
            }
            if(q.extra!=='none' && AUTO_EXTRAS[q.extra]) add(q.extra,AUTO_EXTRAS[q.extra]+' · por ejemplar',copies);
            if(q.design) add('design','Diseño · por pedido',1);
            if(q.urgent) {
                const subtotal=lines.every(l=>l.amount!==null)?lines.reduce((sum,l)=>sum+l.amount,0):null;
                add('urgent','Urgencia (%)',subtotal===null?0:subtotal/100);
                if(subtotal===null) lines[lines.length-1].amount=null;
            }
            const ready=lines.every(l=>l.amount!==null);
            return {format,pages,copies,sheets,sheetsPerCopy,volumes,sheetsPerVolume,lines,ready,total:ready?lines.reduce((sum,l)=>sum+l.amount,0):null};
        }
        function autoSummary() {
            const r=calculateAutoQuote();
            return `<p class="text-xs uppercase tracking-widest mb-3">Resumen de tu solicitud</p><h3 class="text-xl font-extrabold mb-5">${esc(r.format.label)}</h3>
                <p class="text-sm mb-4">${r.pages} página(s) × ${r.copies} ejemplar(es)<br>${r.sheetsPerCopy} hojas por ejemplar · ${r.sheets} hojas en total</p>
                ${r.volumes?`<p class="text-sm mb-3">${r.volumes} tomo(s), hasta ${r.sheetsPerVolume} hojas por tomo.</p>`:''}
                ${r.lines.map(l=>`<div class="auto-line"><span>${esc(l.label)}</span><strong class="whitespace-nowrap">${l.amount===null?'Por confirmar':money(l.amount)}</strong></div>`).join('')}
                <p class="text-xs uppercase tracking-widest mt-6 mb-1">${r.ready?'Total estimado':'Precio pendiente'}</p>
                <div class="text-3xl font-extrabold mb-3">${r.ready?money(r.total):'Por confirmar'}</div>
                <p class="text-xs mb-6">${r.ready?'Confirmaremos disponibilidad y plazo por WhatsApp.':'Puedes enviar la solicitud. Te confirmaremos las tarifas pendientes por WhatsApp.'}</p>
                <button type="button" onclick="window.sendAutoWhatsApp()" class="w-full rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold p-4">Enviar cotización por WhatsApp ↗</button>`;
        }

            document.getElementById('auto-spiral-wrap').hidden=!state.autoQuote.binding;
            document.getElementById('auto-summary').innerHTML=autoSummary();
        };
        window.sendAutoWhatsApp = () => {
            const form=document.getElementById('auto-quote-form');
            if(!form.reportValidity()) return;
            window.updateAutoQuote();
            const q=state.autoQuote,r=calculateAutoQuote();
            const phone=String(state.settings.contactPhone||'').replace(/\D/g,'');
            if(!/^\d{8,15}$/.test(phone)) { window.showToast('WhatsApp sin configurar','Revisa el teléfono del negocio en Configuración Web.','error'); return; }
            const message=[`Hola ${state.settings.storeName}, solicito una cotización:`,
                q.client?`Cliente: ${q.client}`:'',q.phone?`Mi celular: ${q.phone}`:'',

                r.volumes?`Anillado: ${r.volumes} tomo(s), ${r.sheetsPerVolume} hojas aprox. por tomo; espiral ${q.spiral}`:'',
                '',...r.lines.map(l=>`${l.label}: ${l.amount===null?'por confirmar':money(l.amount)}`),
                '',`Total estimado: ${r.ready?money(r.total):'por confirmar (faltan tarifas)'}`, 'Por favor, confirmar el precio y el plazo de entrega.'].filter(x=>x!==null).join('\n');
            window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(message),'_blank','noopener,noreferrer');
        };
        function renderAutoQuote() {

            <div class="grid lg:grid-cols-3 gap-6 items-start"><form id="auto-quote-form" onsubmit="event.preventDefault();window.sendAutoWhatsApp()" oninput="window.updateAutoQuote()" onchange="window.updateAutoQuote()" class="lg:col-span-2 bg-white border border-slate-200 p-6 md:p-8 rounded-3xl shadow-sm"><div class="grid sm:grid-cols-2 gap-5">
                <h3 class="sm:col-span-2 font-extrabold text-slate-900">01 · Datos de tu trabajo</h3>

                <label class="auto-label sm:col-span-2">Acabado adicional${select('extra',[['none','Ninguno'],['laminate','Plastificado / laminado'],['binding','Empastado'],['cut','Corte / guillotina']])}</label>
                <label class="auto-label flex items-center gap-3"><input name="design" type="checkbox" ${q.design?'checked':''}> Necesito diseño gráfico</label>
                <label class="auto-label flex items-center gap-3"><input name="urgent" type="checkbox" ${q.urgent?'checked':''}> Solicitud urgente</label>
            </div></form><aside id="auto-summary" aria-live="polite" class="auto-summary lg:sticky lg:top-24">${autoSummary()}</aside></div></div></section>`;
        }
        function renderAutoPriceSettings() {
            const prices=state.settings.autoPrices||{};
            const input=(key,label)=>`<input aria-label="${esc(label)}" name="auto_${key}" type="number" min="0" step="0.01" placeholder="Sin precio" value="${esc(prices[key]??'')}" class="auto-field min-w-[6rem]">`;
            return `<div class="md:col-span-2 border-t pt-6"><h3 class="text-xl font-black text-slate-900">Precios · Cotización automática</h3><p class="text-xs text-slate-500 mt-2">Completa tus tarifas en soles. Vacío = por confirmar; 0 = gratuito. Cada tarifa de impresión corresponde a una hoja física completa para el formato y las caras indicadas. Se guarda con el botón Guardar cambios.</p></div>
                ${['menor','mayor'].map(t=>`<details class="md:col-span-2 border border-slate-200 rounded-xl p-4" ${t==='menor'?'open':''}><summary class="font-extrabold cursor-pointer">Tarifas por ${t}</summary><div class="overflow-x-auto mt-4"><table class="w-full text-sm"><thead><tr class="text-left"><th class="p-2">Formato · precio por hoja</th><th class="p-2">Color (S/)</th><th class="p-2">B/N (S/)</th></tr></thead><tbody>${AUTO_FORMATS.map(f=>`<tr class="border-t border-slate-100"><th class="text-left p-2 font-medium">${esc(f.label)}</th>${['color','bn'].map(c=>`<td class="p-2">${input(f.id+'_'+c+'_'+t,f.label+' '+c+' '+t)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`).join('')}
                <h4 class="md:col-span-2 font-bold border-t pt-4">Anillado · precio por tomo (incluye espiral y micas)</h4>
                ${['1–100','101–200','201–300','301–350'].map((range,i)=>`<label class="auto-label">${range} hojas por tomo${input('anillado_'+(i+1),range+' hojas')}</label>`).join('')}
                <p class="md:col-span-2 text-xs text-slate-500">Más de 350 hojas: se reparten en tomos equilibrados y se cobra cada tomo según su rango.</p>

                <p class="md:col-span-2 text-xs text-slate-500">La urgencia aplica sobre impresión, anillado, acabados y diseño. El número de destino de WhatsApp se configura en Identidad y Contacto.</p>`;

        window.toggleTheme = () => {

            const displayServices = getPrintServices();

                    <!-- Header Navigation -->

                                    ${cartItemsCount > 0 ? `<span class="absolute -top-1 -right-1 bg-brand-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center animate-bounce shadow-md">${cartItemsCount}</span>` : ''}

        function renderAdminDashboardTab() {

            return `

        function renderAdminProductsTab() {
            return `<div class="max-w-6xl mx-auto space-y-6"><div class="bg-white p-6 rounded-2xl border border-slate-200"><h2 class="text-2xl font-black text-slate-900">Productos del inventario</h2><p class="text-sm text-slate-500 mt-2">Los productos, fotos, precios y existencias se administran desde tu aplicación de inventario. Aquí se muestran automáticamente.</p><p class="text-sm mt-3">${inventoryStatusText()}</p></div><div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="p-4">Producto</th><th class="p-4">Categoría</th><th class="p-4">Existencias</th><th class="p-4">Venta</th><th class="p-4">Por mayor</th></tr></thead><tbody>${state.products.map(p=>`<tr class="border-b border-slate-100"><td class="p-4 font-bold">${esc(p.name)}</td><td class="p-4">${esc(p.category)}</td><td class="p-4">${stockLabel(p)}</td><td class="p-4">S/ ${window.formatPrice(p.price)}</td><td class="p-4">${p.bulkPrice>0?'S/ '+window.formatPrice(p.bulkPrice):'No indicado'}</td></tr>`).join('') || '<tr><td class="p-6" colspan="5">Sin productos para mostrar.</td></tr>'}</tbody></table></div></div>`;
        }

        const DEFAULT_PRINT_SERVICES = [
            {id:'impresion',name:'Impresión B/N y Color',icon:'📄',description:'Formatos A4, A3, Carta y Oficio con calidad láser.'},
            {id:'planos',name:'Ploteo de Planos',icon:'📐',description:'Impresión de planos en formato A0, A1, A2 en papel bond.'},
            {id:'gigantografias',name:'Gigantografías y Lonas',icon:'📢',description:'Banners publicitarios de alta resolución para exteriores.'},
            {id:'anillados',name:'Anillados',icon:'📚',description:'Anillado espiral con micas para tesis, trabajos y manuales.'},
            {id:'papeleria',name:'Tarjetas y Papelería',icon:'📇',description:'Tarjetas de presentación en couché, flyers y afiches.'},
            {id:'stickers',name:'Stickers y Etiquetas',icon:'🏷️',description:'Impresión y troquelado en vinil adhesivo resistente.'}
        ];
        function getPrintServices() {
            const source=state.services.length?state.services:DEFAULT_PRINT_SERVICES;
            return source.map((service,index)=>{
                const id=String(service.id||'service_'+index);
                const custom=state.settings.printServiceDetails?.[id]||{};
                const originalName=service.name||'Servicio';
                const name=custom.name??(/anillados\s+y\s+empastados/i.test(originalName)?'Anillados':originalName);
                const originals=Array.isArray(service.images)?service.images:service.image?[service.image]:[];
                const images=(Array.isArray(custom.images)?custom.images:originals).map(img=>inventoryImage(typeof img==='string'?img:img?.url)).filter(Boolean);
                return {id,name,icon:service.icon||'📌',description:custom.description??service.description??service.desc??'',images};
            });
        }
        function renderPrintServiceSettings() {
            return `<div class="md:col-span-2 border-t pt-6"><h3 class="text-xl font-black text-slate-900">Centro de Impresión · Ventanas flotantes</h3><p class="text-sm text-slate-500 mt-2">Edita el nombre, la descripción y los enlaces de las imágenes de cada opción. Usa enlaces directos a imágenes y coloca uno por línea. Guarda con el botón Guardar cambios.</p></div>
            ${getPrintServices().map((service,index)=>`<details class="md:col-span-2 border border-slate-200 rounded-xl p-4"><summary class="cursor-pointer font-bold text-slate-900">${esc(service.icon)} ${esc(service.name)}</summary><input type="hidden" name="print_service_id_${index}" value="${esc(service.id)}"><div class="grid gap-4 mt-4"><label class="auto-label">Nombre de la opción<input class="auto-field" name="print_service_name_${index}" required maxlength="100" value="${esc(service.name)}"></label><label class="auto-label">Descripción<textarea class="auto-field" name="print_service_description_${index}" rows="4" maxlength="5000">${esc(service.description)}</textarea></label><label class="auto-label">Enlaces de imágenes · uno por línea<textarea class="auto-field" name="print_service_images_${index}" rows="4" placeholder="https://ejemplo.com/imagen.jpg">${esc(service.images.join('\n'))}</textarea></label></div></details>`).join('')}`;
        }
        function readPrintServiceSettings(data,current={}) {
            const result={...current};
            for(let i=0;data.has('print_service_id_'+i);i++) {
                const id=String(data.get('print_service_id_'+i));
                const name=String(data.get('print_service_name_'+i)||'').trim();
                if(!name) throw new Error('Escribe el nombre del servicio.');
                const lines=String(data.get('print_service_images_'+i)||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
                const images=lines.map(inventoryImage);
                if(images.some(s=>!s)) throw new Error('Revisa los enlaces de imágenes de '+name+'. Deben comenzar con https:// o http://.');
                Object.defineProperty(result,id,{value:{name,description:String(data.get('print_service_description_'+i)||'').trim(),images},enumerable:true,configurable:true,writable:true});
            }
            return result;
        }
        let activePrintService=null;
        let printServiceFocus=null;
        window.openPrintService = index => {
            const service=getPrintServices()[index];
            if(!service) return;
            activePrintService=service;
            printServiceFocus=document.activeElement;
            let modal=document.getElementById('print-service-dialog');
            if(!modal) {
                modal=document.createElement('dialog');modal.id='print-service-dialog';modal.className='print-service-dialog';
                modal.setAttribute('aria-labelledby','print-service-title');
                modal.addEventListener('click',e=>{if(e.target===modal)modal.close();});
                modal.addEventListener('close',()=>{activePrintService=null;document.body.style.overflow=modal.dataset.previousOverflow||'';if(printServiceFocus?.isConnected)printServiceFocus.focus();});
                document.body.appendChild(modal);
            }

ooth'})" class="mt-6 rounded-xl px-5 py-3 bg-brand-500 text-white font-bold">Ir al cotizador</button></div></div></div>`;
